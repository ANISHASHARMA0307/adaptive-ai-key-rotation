services:
  - type: web
    name: adaptive-security-drive
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
